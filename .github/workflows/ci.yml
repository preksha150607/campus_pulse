name: CI — CampusPulse Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests & Eval Harness
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (pytest)
        run: |
          python -m pytest test_triage.py -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

      - name: Run evaluation harness (rules-only, no API key needed)
        run: python eval.py
        env:
          PYTHONIOENCODING: utf-8

  lint:
    name: Code Quality (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff linter
        run: ruff check triage.py api/index.py eval.py conftest.py --select=E,F,W,I --ignore=E501
